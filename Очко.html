  document.getElementById('v2-bot-name').textContent = label;
}

function rebuildLedgeDice() {
  if (isWebGLDisposed) return;
  playerLedgeMeshes.forEach(m => gameWorldGroup.remove(m));
  botLedgeMeshes.forEach(m => gameWorldGroup.remove(m));
  playerLedgeMeshes.length = 0; botLedgeMeshes.length = 0;

  const s = BOARD_SCALE;
  const dHalf = getBoardDiceHalf();
  const ledgeY = WALL_H - 0.1 + dHalf * 0.85;

  playerRemainingSkins.forEach((skinId, i) => {
    const m = createSingleDieMesh(skinId);
    m.scale.setScalar(s * 0.85);
    m.position.set(-2.75 + i * 1.1, ledgeY, TRAY_D / 2 + WALL_T / 2);
    m.rotation.set(0, (i * 0.4) - 0.5, 0);
    m.userData = { ledgeIndex: i, skinId, picked: false, baseY: ledgeY };
    playerLedgeMeshes.push(m);
  });

  botRemainingSkins.forEach((skinId, i) => {
    const m = createSingleDieMesh(skinId);
    m.scale.setScalar(s * 0.85);
    m.position.set(2.75 - i * 1.1, ledgeY, -TRAY_D / 2 - WALL_T / 2);
    m.rotation.set(0, (i * 0.5) + 0.3, 0);
    m.userData = { ledgeIndex: i, skinId, picked: false, baseY: ledgeY };
    botLedgeMeshes.push(m);
  });

  redrawCornerDiceButtons();
  requestRender();
}

function clearTrayDice() {
  boardDice.forEach(d => gameWorldGroup.remove(d.mesh));
  boardDice.length = 0;
  requestRender();
}

function syncSelectedSkinsToGame() {
  if (!isBoxOpen && !isStandaloneBoxMode) {
    ensurePoolHasSixDice();
    const targetCount = (game.phase === 'playing' && boardDice.length > 0)
      ? Math.max(1, Math.min(6, playerRemainingSkins.length || 6))
      : 6;
    playerRemainingSkins = playerSelectedSkins.slice(0, targetCount);
    rebuildLedgeDice();
  }
  if (collectorBoxBuilt) {
    rebuildTopHand3DDice();
    updateBox3DDiceTransforms();
  }
  savePlayerStateToStorage();
}

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ledgePlane  = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(WALL_H + 0.2));
const intersectPt = new THREE.Vector3();
let isBoxOpen = false;
let lastHoverSoundTime = 0;
let lastHoveredBotMesh = null;
let boxOpenRequestSeq = 0;

function updateMouseNDC(clientX, clientY) {
  const rect = wrapEl.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
}

function canOpenCollectorBox() {
  return !game.rolling && (
    (game.phase === 'playing' && game.turn === 'player') ||
    game.phase === 'over'
  );
}

function openCollectorBoxNow() {
  if (isWebGLDisposed) return;
  isBoxOpen = true;
  document.body.classList.remove('mode-box-boot');
  gameWorldGroup.visible = false;
  collectorBoxGroup.visible = true;
  document.getElementById('box-screen-ui').classList.add('open');
  document.getElementById('hud-v2').style.visibility = 'hidden';
  document.getElementById('side-status-log').style.visibility = 'hidden';

  ensureCollectorBoxBuilt();
  camera.position.set(0, 14.8, 0.01);
  camera.lookAt(0, 0, -0.35);
  rebuildTopHand3DDice();
  updateBox3DDiceTransforms();
  requestRender();
}

function setCollectorBoxOpen(open) {
  const reqSeq = ++boxOpenRequestSeq;

  if (open) {
    if (game.phase !== 'playing' || boardDice.length === 0) {
      savedRemainingCountBeforeBox = 6;
    } else {
      savedRemainingCountBeforeBox = Math.max(1, Math.min(6, playerRemainingSkins.length));
    }

    if (boxPromise && !boxAssetSettled) {
      waitForRequiredAssets(true).then((ok) => {
        if (!ok || reqSeq !== boxOpenRequestSeq || isWebGLDisposed) return;
        openCollectorBoxNow();
      });
      return;
    }

    openCollectorBoxNow();
    return;
  }

  ensurePoolHasSixDice();
  const restoreCount = (game.phase === 'playing' && boardDice.length > 0)
    ? Math.max(1, Math.min(6, savedRemainingCountBeforeBox))
    : 6;
  playerRemainingSkins = playerSelectedSkins.slice(0, restoreCount);
  savePlayerStateToStorage();

  if (isStandaloneBoxMode) {
    if (collectorBoxBuilt) {
      rebuildTopHand3DDice();
      updateBox3DDiceTransforms();
    }
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'OCHKO_BOX_CLOSED',
        playerSkins: [...playerSelectedSkins],
        ownedCounts: [...playerOwnedCounts],
        playerOwnedCounts: [...playerOwnedCounts],
        playerInventory: [...playerOwnedCounts]
      }, '*');
    }
    return;
  }

  isBoxOpen = false;
  document.body.classList.remove('mode-box-boot');
  gameWorldGroup.visible = true;
  collectorBoxGroup.visible = false;
  document.getElementById('box-screen-ui').classList.remove('open');
  document.getElementById('hud-v2').style.visibility = 'visible';
  document.getElementById('side-status-log').style.visibility = 'visible';

  camera.position.set(0, 14.2, 8.5);
  camera.lookAt(0, -0.3, 0.4);
  rebuildLedgeDice();
  updateHUD();
  requestRender();
}

document.getElementById('v2-btn-box').addEventListener('click', () => {
  if (!canOpenCollectorBox()) return;
  setCollectorBoxOpen(true);
});
document.getElementById('btn-close-box-3d').addEventListener('click', () => setCollectorBoxOpen(false));

window.addEventListener('mousemove', (e) => {
  updateMouseNDC(e.clientX, e.clientY);

  if (!isBoxOpen && game.phase === 'trophy_pick') {
    raycaster.setFromCamera(mouseNDC, camera);
    const hovered = findClickedBotLedgeMesh();
    if (hovered !== lastHoveredBotMesh) {
      lastHoveredBotMesh = hovered;
      botLedgeMeshes.forEach(m => {
        if (m.userData.picked) return;
        const isHov = (m === hovered);
        m.position.y = m.userData.baseY + (isHov ? 0.16 : 0);
        m.scale.setScalar(BOARD_SCALE * (isHov ? 0.96 : 0.85));
      });
      requestRender();
    }
    return;
  }

  if (!isBoxOpen || !collectorBoxBuilt) return;
  raycaster.setFromCamera(mouseNDC, camera);

  if (raycaster.ray.intersectPlane(groundPlane, intersectPt)) {
    let pokedAny = false;
    for (let t = 0; t < 8; t++) {
      const visibleCount = getCountInBoxCell(t);
      if (visibleCount <= 0) continue;
      const states = boxDiceStates[t];
      for (let k = 0; k < visibleCount; k++) {
        const st = states[k];
        const dx = st.x - intersectPt.x;
        const dz = st.z - intersectPt.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 0.78 && Math.abs(st.velY) < 0.03) {
          pokedAny = true;
          const push = (0.78 - dist) * 0.09;
          const inv = dist > 0.001 ? 1 / dist : 1;
          st.vx += (dx * inv + (Math.random() - 0.5) * 0.5) * push;
          st.vz += (dz * inv + (Math.random() - 0.5) * 0.5) * push;
          st.velY = 0.038 + Math.random() * 0.022;
          st.velWX = (Math.random() - 0.5) * 0.28;
          st.velWZ = (Math.random() - 0.5) * 0.28;
          const now = performance.now();
          if (now - lastHoverSoundTime > 95) {
            lastHoverSoundTime = now;
            sfx.init();
            sfx.playHit(0.14, true);
          }
        }
      }
    }
    if (pokedAny) requestRender();
  }
});

function takeOneDieFromBoxCellToPool(typeId) {
  const availableInCell = getCountInBoxCell(typeId);
  if (availableInCell <= 0) return false;

  let displacedType = -1;
  if (playerSelectedSkins.length >= 6) {
    displacedType = playerSelectedSkins.shift();
  }
  playerSelectedSkins.push(typeId);
  syncSelectedSkinsToGame();

  if (displacedType >= 0 && collectorBoxBuilt) {
    const newCount = getCountInBoxCell(displacedType);
    const st = boxDiceStates[displacedType][Math.max(0, newCount - 1)];
    if (st) {
      st.velY = 0.085;
      st.velWX = (Math.random() - 0.5) * 0.4;
      st.velWZ = (Math.random() - 0.5) * 0.4;
    }
  }

  topHandMeshes.forEach(h => { h.velY = 0.075; });
  requestRender();
  return true;
}

/* ============================================================================
   10. ЗВУК И ФИЗИКА БРОСКА НА ДОСКЕ
============================================================================ */
class BoneSound {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playHit(force = 0.8, isBone = false) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const v = Math.min(1, Math.max(0.04, force));
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = isBone ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(isBone ? (940 + Math.random() * 320) : (210 + Math.random() * 110), now);
    osc.frequency.exponentialRampToValueAtTime(48, now + 0.045);
    gain.gain.setValueAtTime(v * 0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.048);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.05);
  }
}
const sfx = new BoneSound();

let activeThrowAnim = null;

function pickSpreadTarget(existingPoints, zoneZ = 0) {
  let bestX = 0, bestZ = 0, bestClearance = -1;
  for (let attempt = 0; attempt < 28; attempt++) {
    const tx = (Math.random() - 0.5) * (TRAY_W - 2.6);
    const tz = zoneZ !== 0
      ? (zoneZ * (0.8 + Math.random() * 1.8))
      : ((Math.random() - 0.5) * (TRAY_D - 2.3));
    let minD = 999;
    for (const p of existingPoints) {
      const d = Math.hypot(tx - p.x, tz - p.z);
      if (d < minD) minD = d;
    }
    if (minD > bestClearance) {
      bestClearance = minD; bestX = tx; bestZ = tz;
    }
  }
  existingPoints.push({ x: bestX, z: bestZ });
  return { x: bestX, z: bestZ };
}

function throwDiceBatchPhysics(descriptors, onComplete) {
  sfx.init();
  const duration = 1.20, steps = 185, dt = duration / steps;
  const effSize = getBoardDiceSize();
  const effHalf = getBoardDiceHalf();
  const boundX = TRAY_W / 2 - effHalf - 0.22;
  const boundZ = TRAY_D / 2 - effHalf - 0.22;
  const minSep = effSize * 1.46;

  const occupiedTargets = boardDice.map(d => ({ x: d.x, z: d.z }));

  const newBodies = descriptors.map((desc, i) => {
    const mesh = createSingleDieMesh(desc.skinId);
    const target = pickSpreadTarget(occupiedTargets, desc.zoneZ || 0);
    const startX = ((i % 2 === 0) ? -1.6 : 1.6) + (Math.random() - 0.5) * 1.8;
    const startZ = desc.fromTop ? (-TRAY_D / 2 + 0.55) : (TRAY_D / 2 - 0.55);
    const startY = 2.05 + (i % 2) * 0.26;

    return {
      mesh, skinId: desc.skinId, owner: desc.owner, targetFace: desc.face,
      x: startX, y: startY, z: startZ,
      vx: (target.x - startX) * (1.55 + Math.random() * 0.22),
      vy: -1.0,
      vz: (target.z - startZ) * (1.55 + Math.random() * 0.22),
      finalYaw: Math.random() * Math.PI * 2,
      extraSpinsX: (2 + Math.floor(Math.random() * 2)) * Math.PI * 2 * (Math.random() > 0.5 ? 1 : -1),
      extraSpinsZ: (2 + Math.floor(Math.random() * 2)) * Math.PI * 2 * (Math.random() > 0.5 ? 1 : -1),
      frames: [], sounds: []
    };
  });

  const restingBodies = boardDice.map(d => ({
    mesh: d.mesh, x: d.x, y: effHalf, z: d.z, vx: 0, vz: 0,
    baseQuat: d.mesh.quaternion.clone(), frames: []
  }));

  const allSimBodies = [...newBodies, ...restingBodies];

  for (let s = 0; s <= steps; s++) {
    const tNorm = s / steps;
    newBodies.forEach(b => {
      b.vy -= 28.0 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      if (b.y < effHalf) {
        b.y = effHalf;
        if (Math.abs(b.vy) > 1.1) b.sounds.push({ step: s, force: Math.min(1, Math.abs(b.vy) / 10), bone: false });
        b.vy = -b.vy * 0.40;
        b.vx *= 0.86; b.vz *= 0.86;
      }
    });

    restingBodies.forEach(r => {
      r.x += r.vx * dt; r.z += r.vz * dt;
      r.vx *= 0.82; r.vz *= 0.82;
    });

    for (let iter = 0; iter < 6; iter++) {
      for (let i = 0; i < allSimBodies.length; i++) {
        const A = allSimBodies[i];
        if (A.x > boundX)  { A.x = boundX;  if (A.vx > 0) A.vx = -A.vx * 0.55; }
        if (A.x < -boundX) { A.x = -boundX; if (A.vx < 0) A.vx = -A.vx * 0.55; }
        if (A.z > boundZ)  { A.z = boundZ;  if (A.vz > 0) A.vz = -A.vz * 0.55; }
        if (A.z < -boundZ) { A.z = -boundZ; if (A.vz < 0) A.vz = -A.vz * 0.55; }

        for (let j = i + 1; j < allSimBodies.length; j++) {
          const B = allSimBodies[j];
          if (Math.abs(A.y - B.y) > effSize * 0.95) continue;
          let dx = B.x - A.x, dz = B.z - A.z;
          let dist = Math.hypot(dx, dz);
          if (dist < minSep) {
            if (dist < 0.0001) { dx = 0.01; dz = 0.01; dist = Math.hypot(dx, dz); }
            const nx = dx / dist, nz = dz / dist;
            const overlap = (minSep - dist) * 0.52;
            A.x -= nx * overlap; A.z -= nz * overlap;
            B.x += nx * overlap; B.z += nz * overlap;

            if (iter === 0) {
              const rvx = B.vx - A.vx, rvz = B.vz - A.vz;
              const vn = rvx * nx + rvz * nz;
              if (vn < 0) {
                const imp = -0.72 * vn;
                A.vx -= imp * nx; A.vz -= imp * nz;
                B.vx += imp * nx; B.vz += imp * nz;
                if (A.sounds && Math.abs(vn) > 1.0) {
                  A.sounds.push({ step: s, force: Math.min(1, Math.abs(vn) / 6), bone: true });
                }
              }
            }
          }
        }
      }
    }

    const decay = Math.pow(1 - tNorm, 2.5);
    newBodies.forEach(b => {
      const target = TARGET_EULER_TABLE[b.targetFace];
      const rx = target.x + b.extraSpinsX * decay;
      const rz = target.z + b.extraSpinsZ * decay;
      const ry = b.finalYaw + (b.extraSpinsX * 0.3) * decay;
      const qYaw  = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry);
      const qFace = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, 0, rz, 'XYZ'));
      b.frames.push({ pos: new THREE.Vector3(b.x, b.y, b.z), quat: qYaw.multiply(qFace) });
    });

    restingBodies.forEach(r => {
      r.frames.push({ pos: new THREE.Vector3(r.x, effHalf, r.z), quat: r.baseQuat });
    });
  }

  restingBodies.forEach((r, idx) => {
    const last = r.frames[steps];
    boardDice[idx].x = last.pos.x; boardDice[idx].z = last.pos.z;
  });
  newBodies.forEach(b => {
    const last = b.frames[steps];
    boardDice.push({ mesh: b.mesh, x: last.pos.x, z: last.pos.z, face: b.targetFace, skinId: b.skinId, owner: b.owner });
  });

  activeThrowAnim = {
    start: performance.now(), duration: duration * 1000, steps,
    newBodies, restingBodies, played: new Set(), onComplete
  };
  requestRender();
}

/* ============================================================================
   11. ЛОГИКА ПАРТИИ ДО 3 ПОБЕД И ВЫБОР 2 КОСТЕЙ ПРЯМО НА ВЕРХНЕМ БОРТИКЕ ДОСКИ
============================================================================ */
const game = {
  phase: 'tiebreak',
  turn: 'player',
  rolling: false,
  playerScore: 0,
  botScore: 0,
  playerWins: 0,
  botWins: 0,
  playerPassed: false,
  botPassed: false,
  tiebreakPlayerSum: 0,
  tiebreakBotSum: 0
};

let pickedTrophySkins = [];

const elSideLog = document.getElementById('side-status-log');
function setStatusLog(text) {
  elSideLog.textContent = text;
}

function updateHUD() {
  document.getElementById('v2-score-player').textContent = game.playerScore;
  document.getElementById('v2-score-bot').textContent    = game.botScore;
  document.getElementById('v2-wins-player').textContent  = game.playerWins;
  document.getElementById('v2-wins-bot').textContent     = game.botWins;
  document.getElementById('v2-prof-player').classList.toggle('active-turn', game.turn === 'player' && game.phase === 'playing');
  document.getElementById('v2-prof-bot').classList.toggle('active-turn', game.turn === 'bot' && game.phase === 'playing');
  document.getElementById('v2-score-player').classList.toggle('bust', game.playerScore > 21);
  document.getElementById('v2-score-bot').classList.toggle('bust', game.botScore > 21);

  const pLeft = playerRemainingSkins.length;
  const canPlayerRoll = (!game.rolling && game.phase === 'playing' && game.turn === 'player' && !game.playerPassed);
  const isTiebreakReady = (!game.rolling && game.phase === 'tiebreak');

  document.getElementById('v2-roll-1').disabled = !(isTiebreakReady || (canPlayerRoll && pLeft >= 1));
  document.getElementById('v2-roll-2').disabled = !(isTiebreakReady || (canPlayerRoll && pLeft >= 2));
  document.getElementById('v2-pass').disabled = !(canPlayerRoll && game.playerScore > 0);
  document.getElementById('v2-btn-box').disabled = !canOpenCollectorBox();

  const isOver = (game.phase === 'over');
  document.getElementById('v2-pass').style.display = isOver ? 'none' : 'inline-block';
  document.getElementById('v2-new-round').style.display = isOver ? 'inline-block' : 'none';
}

function runInitialTiebreakRoll(diceCountEach = 2, fromScheduledReroll = false) {
  if (isStandaloneBoxMode || isWebGLDisposed || game.rolling) return;
  if (diceCountEach === 1) {
    if (!fromScheduledReroll || game.phase !== 'tiebreak_resolving') return;
  } else {
    if (game.phase !== 'tiebreak') return;
  }

  if (autoTiebreakTimerId !== null) {
    clearTimeout(autoTiebreakTimerId);
    activeGameTimers.delete(autoTiebreakTimerId);
    autoTiebreakTimerId = null;
  }

  hasStartedMatch = true;
  game.rolling = true;

  if (diceCountEach === 2) {
    clearTrayDice();
    game.tiebreakPlayerSum = 0;
    game.tiebreakBotSum = 0;
  } else if (playerRemainingSkins.length < diceCountEach || botRemainingSkins.length < diceCountEach) {
    clearTrayDice();
    ensurePoolHasSixDice();
    playerRemainingSkins = [...playerSelectedSkins];
    resetBotSkinsForRound();
  }

  const pVals = [], bVals = [], batch = [];
  for (let i = 0; i < diceCountEach; i++) {
    const pv = 1 + Math.floor(Math.random() * 6);
    const bv = 1 + Math.floor(Math.random() * 6);
    pVals.push(pv); bVals.push(bv);
    const pSkin = playerRemainingSkins.shift() ?? playerSelectedSkins[i] ?? 0;
    const bSkin = botRemainingSkins.shift() ?? botMatchSkins[i] ?? 2;
    batch.push({ face: pv, skinId: pSkin, fromTop: false, owner: 'player', zoneZ:  1 });
    batch.push({ face: bv, skinId: bSkin, fromTop: true,  owner: 'bot',    zoneZ: -1 });
  }

  rebuildLedgeDice();
  updateHUD();
  setStatusLog(diceCountEach === 2
    ? 'Жеребьёвка первого хода: оба кидают по 2 кости...'
    : 'Ничья на жеребьёвке! Докидываем ещё по 1 кости...');

  throwDiceBatchPhysics(batch, () => {
    game.rolling = false;
    game.phase = 'tiebreak_resolving';
    updateHUD();

    game.tiebreakPlayerSum += pVals.reduce((a, b) => a + b, 0);
    game.tiebreakBotSum    += bVals.reduce((a, b) => a + b, 0);

    if (game.tiebreakPlayerSum === game.tiebreakBotSum) {
      showCenterBanner('draw');
      setStatusLog(`Ровно по ${game.tiebreakPlayerSum}! Бросаем ещё по 1 кости...`);
      scheduleGameTimeout(() => runInitialTiebreakRoll(1, true), 950);
    } else {
      const playerFirst = game.tiebreakPlayerSum > game.tiebreakBotSum;
      setStatusLog(
        `Жеребьёвка: ${game.tiebreakPlayerSum} против ${game.tiebreakBotSum}. ` +
        (playerFirst ? 'Ты ходишь первым!' : 'Соперник ходит первым!')
      );

      scheduleGameTimeout(() => {
        clearTrayDice();
        ensurePoolHasSixDice();
        playerRemainingSkins = [...playerSelectedSkins];
        resetBotSkinsForRound();
        rebuildLedgeDice();
        game.phase = 'playing';
        game.turn = playerFirst ? 'player' : 'bot';
        game.playerScore = 0;
        game.botScore = 0;
        updateHUD();

        if (playerFirst) {
          setStatusLog('Кон начался — у тебя 6 костей. Твой первый ход!');
        } else {
          setStatusLog('Кон начался — соперник ходит первым...');
          scheduleGameTimeout(botSingleTurn, 750);
        }
      }, 1250);
    }
  });
}

function advanceTurnAfterAction(lastActor) {
  if (game.phase !== 'playing') return;

  if (game.playerPassed && game.botPassed) {
    compareScores();
    return;
  }

  const pLeft = playerRemainingSkins.length;
  const bLeft = botRemainingSkins.length;
  const playerOut = (!game.playerPassed && pLeft === 0);
  const botOut    = (!game.botPassed && bLeft === 0);
  const playerDoneOrOut = (game.playerPassed || pLeft === 0);
  const botDoneOrOut    = (game.botPassed || bLeft === 0);

  if (playerDoneOrOut && botDoneOrOut) {
    if (playerOut && botOut) {
      if (game.playerScore < 21 && game.botScore < 21) {
        clearTrayDice();
        ensurePoolHasSixDice();
        playerRemainingSkins = [...playerSelectedSkins];
        resetBotSkinsForRound();
        rebuildLedgeDice();
        if (lastActor === 'player') {
          game.turn = 'bot';
          updateHUD();
          setStatusLog(`Кости сняты со стола (счёт ${game.playerScore}:${game.botScore}) — ход соперника...`);
          scheduleGameTimeout(botSingleTurn, 850);
        } else {
          game.turn = 'player';
          updateHUD();
          setStatusLog(`Кости сняты со стола (счёт ${game.playerScore}:${game.botScore}) — докидывай до 21!`);
        }
        return;
      }
      compareScores();
      return;
    }

    if (game.botPassed && playerOut) {
      if (game.playerScore < 21 && game.playerScore <= game.botScore) {
        clearTrayDice();
        ensurePoolHasSixDice();
        playerRemainingSkins = [...playerSelectedSkins];
        rebuildLedgeDice();
        game.turn = 'player';
        updateHUD();
        setStatusLog(`Кости сняты со стола (счёт ${game.playerScore}:${game.botScore}) — докидывай до 21!`);
        return;
      }
      compareScores();
      return;
    }

    if (game.playerPassed && botOut) {
      if (game.botScore < 21 && game.botScore < game.playerScore) {
        clearTrayDice();
        resetBotSkinsForRound();
        rebuildLedgeDice();
        game.turn = 'bot';
        updateHUD();
        setStatusLog(`Кости сняты со стола (счёт ${game.playerScore}:${game.botScore}) — соперник добирает...`);
        scheduleGameTimeout(botSingleTurn, 850);
        return;
      }
      compareScores();
      return;
    }

    compareScores();
    return;
  }

  if (lastActor === 'player') {
    if (!botDoneOrOut) {
      game.turn = 'bot'; updateHUD(); scheduleGameTimeout(botSingleTurn, 750);
    } else {
      game.turn = 'player'; updateHUD();
    }
  } else {
    if (!playerDoneOrOut) {
      game.turn = 'player'; updateHUD();
    } else {
      game.turn = 'bot'; updateHUD(); scheduleGameTimeout(botSingleTurn, 750);
    }
  }
}

function playerThrow(count) {
  if (game.rolling || isBoxOpen || game.phase === 'tiebreak_resolving' || game.phase === 'match_ending') return;
  if (game.phase === 'tiebreak') {
    runInitialTiebreakRoll(2);
    return;
  }
  if (game.phase !== 'playing' || game.turn !== 'player' || game.playerPassed) return;

  const n = Math.min(count, playerRemainingSkins.length);
  if (n <= 0) return;

  game.rolling = true;
  const vals = [], batch = [];
  for (let i = 0; i < n; i++) {
    const fv = 1 + Math.floor(Math.random() * 6);
    const sk = playerRemainingSkins.shift();
    vals.push(fv);
    batch.push({ face: fv, skinId: sk, fromTop: false, owner: 'player', zoneZ: 0 });
  }

  rebuildLedgeDice();
  updateHUD();
  setStatusLog(`Твой бросок (${n === 2 ? '2 кости' : '1 кость'})...`);

  throwDiceBatchPhysics(batch, () => {
    game.rolling = false;
    game.playerScore += vals.reduce((a, b) => a + b, 0);
    updateHUD();

    const rollStr = vals.join(' + ');
    if (game.playerScore > 21) {
      finishRound('bot', `Перебор (${game.playerScore})! Выпало ${rollStr}`);
      return;
    }
    if (game.playerScore === 21) {
      game.playerPassed = true;
      setStatusLog(`Выпало ${rollStr} — ровно 21! Ход соперника`);
      advanceTurnAfterAction('player');
      return;
    }
    setStatusLog(`Ты: ${rollStr} (У тебя: ${game.playerScore}). Ход соперника...`);
    advanceTurnAfterAction('player');
  });
}

function botSingleTurn() {
  if (game.phase !== 'playing' || game.turn !== 'bot' || game.rolling) return;
  if (botRemainingSkins.length === 0) {
    advanceTurnAfterAction('bot');
    return;
  }

  const playerStopped = game.playerPassed;
  if (
    game.botScore === 21 ||
    (playerStopped && game.botScore > game.playerScore) ||
    (game.botScore >= 19 && game.botScore >= game.playerScore)
  ) {
    game.botPassed = true;
    showCenterBanner('pass');
    setStatusLog(`Соперник пасует на ${game.botScore} очк. Твой ход!`);
    advanceTurnAfterAction('bot');
    return;
  }

  const gap = 21 - game.botScore;
  const desired = (gap <= 6 || botRemainingSkins.length === 1) ? 1 : 2;
  const n = Math.min(desired, botRemainingSkins.length);
  if (n <= 0) {
    advanceTurnAfterAction('bot');
    return;
  }
  game.rolling = true;

  const vals = [], batch = [];
  for (let i = 0; i < n; i++) {
    const fv = 1 + Math.floor(Math.random() * 6);
    const sk = botRemainingSkins.shift();
    vals.push(fv);
    batch.push({ face: fv, skinId: sk, fromTop: true, owner: 'bot', zoneZ: 0 });
  }

  rebuildLedgeDice();
  updateHUD();
  setStatusLog(`Соперник кидает ${n === 2 ? '2 кости' : '1 кость'}...`);

  throwDiceBatchPhysics(batch, () => {
    game.rolling = false;
    game.botScore += vals.reduce((a, b) => a + b, 0);
    updateHUD();

    const rollStr = vals.join(' + ');
    if (game.botScore > 21) {
      finishRound('player', `У соперника перебор (${game.botScore})! Твоя победа`);
      return;
    }
    if (game.botScore === 21) {
      game.botPassed = true;
      showCenterBanner('pass');
    }

    setStatusLog(`Соперник: ${rollStr} (У него: ${game.botScore}). Твой ход!`);
    advanceTurnAfterAction('bot');
  });
}

function compareScores() {
  if (game.botScore > game.playerScore) {
    finishRound('bot', `Соперник выиграл кон (${game.botScore} против ${game.playerScore})`);
  } else if (game.botScore < game.playerScore) {
    finishRound('player', `Твоя победа в коне! (${game.playerScore} против ${game.botScore})`);
  } else {
    finishRound('draw', `Ничья — ровно по ${game.playerScore}`);
  }
}

function startTrophyPickPhase() {
  game.phase = 'trophy_pick';
  lastHoveredBotMesh = null;
  pickedTrophySkins = [];
  clearTrayDice();
  playerRemainingSkins = [...playerSelectedSkins];
  resetBotSkinsForRound();
  rebuildLedgeDice();
  updateHUD();

  showSuspendedPromptBanner("ТЫ ПОБЕДИЛ", "ВЫБЕРИ ДВЕ КОСТЯШКИ СОПЕРНИКА", false);
  setStatusLog("Нажми на любые 2 костяшки соперника на верхнем бортике доски, чтобы забрать их себе!");
}

function findClickedBotLedgeMesh() {
  const hits = raycaster.intersectObjects(botLedgeMeshes);
  if (hits.length > 0 && !hits[0].object.userData.picked) {
    return hits[0].object;
  }
  if (raycaster.ray.intersectPlane(ledgePlane, intersectPt)) {
    let best = null, minD = 0.78;
    for (const m of botLedgeMeshes) {
      if (m.userData.picked) continue;
      const d = Math.hypot(intersectPt.x - m.position.x, intersectPt.z - m.position.z);
      if (d < minD) { minD = d; best = m; }
    }
    return best;
  }
  return null;
}

function pickOpponentLedgeDie(mesh) {
  if (!mesh || mesh.userData.picked || pickedTrophySkins.length >= 2) return;
  mesh.userData.picked = true;
  const wonSkin = mesh.userData.skinId;
  pickedTrophySkins.push(wonSkin);

  sfx.init();
  sfx.playHit(0.85, true);

  const pickOrder = pickedTrophySkins.length;
  const startPos = mesh.position.clone();
  const targetSlot = pickOrder === 1 ? 4 : 5;
  const endPos = new THREE.Vector3(
    -2.75 + targetSlot * 1.1,
    mesh.userData.baseY + 0.12,
    TRAY_D / 2 + WALL_T / 2 - 0.15
  );

  flyingTrophyAnims.push({
    mesh,
    startPos,
    endPos,
    startTime: performance.now(),
    duration: 680,
    onDone: () => {
      if (pickOrder === 1) {
        showSuspendedPromptBanner("ВЫБЕРИ ЕЩЁ ОДНУ КОСТЯШКУ", `ВЗЯТО: ${DICE_TYPES[wonSkin].title.toUpperCase()} (1/2)`, false);
      } else if (pickOrder === 2) {
        completeMatchVictoryWithTrophies();
      }
    }
  });
  requestRender();
}

function completeMatchVictoryWithTrophies() {
  hideSuspendedPromptBanner();

  pickedTrophySkins.forEach(wonSkin => {
    playerOwnedCounts[wonSkin] = (playerOwnedCounts[wonSkin] || 0) + 1;
    if (playerSelectedSkins.length >= 6) playerSelectedSkins.shift();
    playerSelectedSkins.push(wonSkin);
  });

  syncSelectedSkinsToGame();

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'OCHKO_MATCH_FINISHED',
        won: true,
        lostStew: 0,
        takenDice: [...pickedTrophySkins],
        lostDice: [],
        opponentId: OPPONENTS_CONFIG[currentOppIdx].id,
        gameIndex: currentOppGameIdx,
        playerSkins: [...playerSelectedSkins],
        ownedCounts: [...playerOwnedCounts],
        playerOwnedCounts: [...playerOwnedCounts],
        playerInventory: [...playerOwnedCounts]
      }, '*');
    }
  } catch (e) {}

  game.playerWins = 0;
  game.botWins = 0;
  scheduleGameTimeout(() => {
    if (!isEmbeddedMatchMode) startNewRoundWithTiebreak();
  }, 550);
}

function handleMatchDefeat3D() {
  game.phase = 'match_lost';
  clearTrayDice();
  playerRemainingSkins = [...playerSelectedSkins];
  resetBotSkinsForRound();
  rebuildLedgeDice();
  updateHUD();

  const lostRareIndices = [];
  playerSelectedSkins.forEach((sk, idx) => {
    if (sk > 0 && lostRareIndices.length < 2) lostRareIndices.push(idx);
  });

  const lostDice = [];
  let lostStew = 0;

  if (lostRareIndices.length === 0) {
    lostStew = 1;
    showSuspendedPromptBanner("ТЫ ПРОИГРАЛ ПАРТИЮ", "СТАВКА (БАНКА ТУШЁНКИ) УХОДИТ СОПЕРНИКУ", true);
    setStatusLog("Партия проиграна. Поставленная банка тушёнки уходит сопернику.");
  } else {
    showSuspendedPromptBanner("ТЫ ПРОИГРАЛ ПАРТИЮ", "СОПЕРНИК ЗАБИРАЕТ ТВОИ ВЫИГРАННЫЕ КОСТИ", true);
    setStatusLog("Партия проиграна. Соперник забирает твои выигранные кости.");

    lostRareIndices.forEach((poolIdx, k) => {
      const m = playerLedgeMeshes[poolIdx];
      if (m) {
        flyingTrophyAnims.push({
          mesh: m,
          startPos: m.position.clone(),
          endPos: new THREE.Vector3(1.5 - k * 1.3, m.userData.baseY + 0.12, -TRAY_D / 2 - WALL_T / 2 + 0.15),
          startTime: performance.now() + k * 140,
          duration: 680
        });
      }
    });
    requestRender();

    const sortedDesc = [...lostRareIndices].sort((a, b) => b - a);
    sortedDesc.forEach(poolIdx => {
      const sk = playerSelectedSkins[poolIdx];
      lostDice.push(sk);
      if (playerOwnedCounts[sk] > 0) playerOwnedCounts[sk]--;
      playerSelectedSkins.splice(poolIdx, 1);
    });
    ensurePoolHasSixDice();
  }

  savePlayerStateToStorage();

  scheduleGameTimeout(() => {
    hideSuspendedPromptBanner();
    syncSelectedSkinsToGame();

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'OCHKO_MATCH_FINISHED',
          won: false,
          lostStew,
          takenDice: [],
          lostDice,
          opponentId: OPPONENTS_CONFIG[currentOppIdx].id,
          gameIndex: currentOppGameIdx,
          playerSkins: [...playerSelectedSkins],
          ownedCounts: [...playerOwnedCounts],
          playerOwnedCounts: [...playerOwnedCounts],
          playerInventory: [...playerOwnedCounts]
        }, '*');
      }
    } catch (e) {}

    game.playerWins = 0;
    game.botWins = 0;
    if (!isEmbeddedMatchMode) startNewRoundWithTiebreak();
  }, 1650);
}

function finishRound(winner, msg) {
  if (winner === 'player') {
    game.playerWins++;
    showCenterBanner('win');
  } else if (winner === 'bot') {
    game.botWins++;
    showCenterBanner('lose');
  } else {
    showCenterBanner('draw');
  }

  const isMatchEnding = (game.playerWins >= 3 || game.botWins >= 3);
  game.phase = isMatchEnding ? 'match_ending' : 'over';

  setStatusLog(`${msg} [Счёт побед: ${game.playerWins}:${game.botWins} до 3]`);
  updateHUD();

  if (game.playerWins >= 3) {
    scheduleGameTimeout(() => startTrophyPickPhase(), 760);
  } else if (game.botWins >= 3) {
    scheduleGameTimeout(() => handleMatchDefeat3D(), 760);
  }
}

function startNewRoundWithTiebreak() {
  clearAllGameTimers();
  activeThrowAnim = null;
  flyingTrophyAnims.length = 0;
  game.rolling = false;
  hideSuspendedPromptBanner();
  clearTrayDice();
  ensurePoolHasSixDice();
  playerRemainingSkins = [...playerSelectedSkins];
  resetBotSkinsForRound();
  game.phase = 'tiebreak';
  game.turn = 'player';
  game.playerScore = 0;
  game.botScore = 0;
  game.playerPassed = false;
  game.botPassed = false;
  rebuildLedgeDice();
  updateHUD();
  if (!isStandaloneBoxMode) runInitialTiebreakRoll(2);
}

document.getElementById('v2-roll-2').addEventListener('click', () => playerThrow(2));
document.getElementById('v2-roll-1').addEventListener('click', () => playerThrow(1));
document.getElementById('v2-pass').addEventListener('click', () => {
  if (game.phase === 'playing' && game.turn === 'player' && !game.rolling && game.playerScore > 0 && !game.playerPassed) {
    game.playerPassed = true;
    setStatusLog(`Ты спасовал на ${game.playerScore}. Ход соперника`);
    advanceTurnAfterAction('player');
  }
});
document.getElementById('v2-new-round').addEventListener('click', () => {
  if (game.phase === 'over' && !game.rolling) startNewRoundWithTiebreak();
});

wrapEl.addEventListener('click', (e) => {
  updateMouseNDC(e.clientX, e.clientY);
  raycaster.setFromCamera(mouseNDC, camera);

  if (!isBoxOpen && game.phase === 'trophy_pick') {
    const clickedDie = findClickedBotLedgeMesh();
    if (clickedDie) {
      pickOpponentLedgeDie(clickedDie);
    }
    return;
  }

  if (isBoxOpen) {
    const handHits = raycaster.intersectObjects(topHandMeshes.map(h => h.mesh));
    if (handHits.length > 0) {
      const hitMesh = handHits[0].object;
      const item = topHandMeshes.find(h => h.mesh === hitMesh);
      if (item) {
        const returnedType = playerSelectedSkins[item.slotIdx];
        playerSelectedSkins.splice(item.slotIdx, 1);
        syncSelectedSkinsToGame();

        const cnt = getCountInBoxCell(returnedType);
        const st = boxDiceStates[returnedType][Math.max(0, cnt - 1)];
        if (st) {
          st.velY = 0.09;
          st.velWX = (Math.random() - 0.5) * 0.45;
          st.velWZ = (Math.random() - 0.5) * 0.45;
        }
        sfx.init(); sfx.playHit(0.55, true);
        requestRender();
      }
      return;
    }

    if (raycaster.ray.intersectPlane(groundPlane, intersectPt)) {
      let bestType = -1;
      for (let t = 0; t < 8; t++) {
        const b = getCellBounds(t);
        if (intersectPt.x >= b.minX - 0.25 && intersectPt.x <= b.maxX + 0.25 &&
            intersectPt.z >= b.minZ - 0.25 && intersectPt.z <= b.maxZ + 0.25) {
          bestType = t;
          break;
        }
      }

      if (bestType >= 0 && getCountInBoxCell(bestType) > 0) {
        takeOneDieFromBoxCellToPool(bestType);
        const remCount = getCountInBoxCell(bestType);
        for (let idx = 0; idx < remCount; idx++) {
          const st = boxDiceStates[bestType][idx];
          st.velY  = 0.075 + (idx % 3) * 0.014;
          st.vx   += (Math.random() - 0.5) * 0.14;
          st.vz   += (Math.random() - 0.5) * 0.14;
          st.velWX = (Math.random() - 0.5) * 0.45;
          st.velWZ = (Math.random() - 0.5) * 0.45;
        }
        sfx.init(); sfx.playHit(0.75, true);
        requestRender();
      }
    }
    return;
  }

  if (game.rolling || game.phase === 'tiebreak_resolving' || game.phase === 'match_ending') return;
  if (game.phase === 'tiebreak') runInitialTiebreakRoll(2);
  else if (game.phase === 'playing' && game.turn === 'player' && !game.playerPassed) {
    playerThrow(playerRemainingSkins.length >= 2 ? 2 : 1);
  } else if (game.phase === 'over') {
    startNewRoundWithTiebreak();
  }
});

wrapEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (!isBoxOpen && !game.rolling && game.phase === 'playing' && game.turn === 'player' && !game.playerPassed && playerRemainingSkins.length >= 1) {
    playerThrow(1);
  }
});

/* ============================================================================
   12. ЖИВОЙ ФОН, ИНТЕГРАЦИЯ С INDEX.HTML, АВТОЗАГРУЗКА АССЕТОВ И ОЧИСТКА ПАМЯТИ
============================================================================ */
let trimPromise = null;
let boxPromise = null;
let trimAssetSettled = false;
let boxAssetSettled = false;
let appliedTrimOnBoot = false;
let messageSeq = 0;

function extractValidCssUrl(val) {
  if (!val || typeof val !== 'string') return '';
  const trimmed = val.trim();
  if (!trimmed || trimmed === 'none' || !/url\s*\(/i.test(trimmed)) return '';
  return trimmed;
}

function resolveParentSceneBackground() {
  if (!window.parent || window.parent === window) return '';
  try {
    const pWin = window.parent;
    const pDoc = pWin.document;
    if (!pDoc) return '';

    const selectors = [
      '.scene-slot.current .layer-bg',
      '.scene-slot.current .layer-dark'
    ];
    for (const sel of selectors) {
      const el = pDoc.querySelector(sel);
      if (!el) continue;
      const inlineBg = extractValidCssUrl(el.style && el.style.backgroundImage);
      if (inlineBg) return inlineBg;
      const compBg = extractValidCssUrl(pWin.getComputedStyle(el).backgroundImage);
      if (compBg) return compBg;
    }

    if (typeof pWin.currentLocationBg === 'string' && pWin.currentLocationBg.trim()) {
      const cur = pWin.currentLocationBg.trim();
      if (cur !== 'none' && !cur.includes('radial-gradient')) return cur;
    }

    const bodyInline = extractValidCssUrl(pDoc.body && pDoc.body.style && pDoc.body.style.backgroundImage);
    if (bodyInline) return bodyInline;
  } catch (e) {}
  return '';
}

function applyBackgroundValue(rawBg) {
  if (!rawBg || typeof rawBg !== 'string') return false;
  const trimmed = rawBg.trim();
  if (!trimmed || trimmed === 'none') return false;

  let cssBg = '';
  if (/^url\s*\(/i.test(trimmed)) {
    cssBg = trimmed;
  } else {
    let decoded = trimmed;
    try {
      decoded = decodeURI(trimmed);
    } catch (e) {}
    const encoded = encodeURI(decoded);
    cssBg = `url("${encoded}")`;
  }

  document.body.style.backgroundImage = cssBg;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  document.body.style.backgroundRepeat = 'no-repeat';
  return true;
}

function applyExternalConfig(cfg = {}, options = {}) {
  const deferBoxOpen = Boolean(options.deferBoxOpen);
  const deferVisuals = Boolean(options.deferVisuals);

  const chosenBg = (cfg.bg && String(cfg.bg).trim())
    ? cfg.bg
    : resolveParentSceneBackground();
  if (chosenBg) {
    applyBackgroundValue(chosenBg);
  }

  const incomingCounts = cfg.ownedCounts || cfg.playerOwnedCounts || cfg.playerInventory;
  if (Array.isArray(incomingCounts) && incomingCounts.length === 8) {
    playerOwnedCounts = incomingCounts.map(n => Math.max(0, Number(n) || 0));
    if (playerOwnedCounts[0] < 6) playerOwnedCounts[0] = 6;
  }
  if (Array.isArray(cfg.playerSkins) && cfg.playerSkins.length > 0) {
    playerSelectedSkins = cfg.playerSkins.slice(0, 6).map(n => Number(n) || 0);
  }
  if (cfg.opponent !== undefined) {
    isEmbeddedMatchMode = true;
    const oIdx = Math.max(0, Math.min(OPPONENTS_CONFIG.length - 1, Number(cfg.opponent) - 1));
    currentOppIdx = oIdx;
    currentOppGameIdx = Math.max(0, Math.min(OPPONENTS_CONFIG[oIdx].games.length - 1, (Number(cfg.game) || 1) - 1));
    game.playerWins = 0;
    game.botWins = 0;
  }
  ensurePoolHasSixDice();

  if (cfg.mode === 'box' || cfg.boxOnly === true || cfg.boxOnly === '1') {
    isStandaloneBoxMode = true;
    document.getElementById('close-box-sub').textContent = '(вернуться в инвентарь)';
    if (!deferBoxOpen) {
      setCollectorBoxOpen(true);
    }
  } else if (cfg.mode === 'match' || cfg.mode === 'game') {
    isStandaloneBoxMode = false;
    isEmbeddedMatchMode = true;
    document.getElementById('close-box-sub').textContent = '(вернуться к доске)';
    if (!deferVisuals) {
      setCollectorBoxOpen(false);
    }
  }

  if (!deferVisuals) {
    syncSelectedSkinsToGame();
    resetBotSkinsForRound();
    updateHUD();
    requestRender();
  } else {
    playerRemainingSkins = [...playerSelectedSkins];
    resetBotSkinsForRound();
    savePlayerStateToStorage();
  }
}

window.initOchkoFromIndex = applyExternalConfig;

function disposeAllWebGLResources() {
  clearAllGameTimers();
  if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
  activeThrowAnim = null;
  flyingTrophyAnims.length = 0;
  game.rolling = false;
  isRenderPaused = true;
  if (rafId !== null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
  if (isWebGLDisposed) return;
  isWebGLDisposed = true;

  disposeMaterialCache();
  if (masterDiceGeo) {
    masterDiceGeo.dispose();
    masterDiceGeo = null;
  }
  if (boxPlaneMesh) {
    if (boxPlaneMesh.material) {
      if (boxPlaneMesh.material.map) boxPlaneMesh.material.map.dispose();
      boxPlaneMesh.material.dispose();
    }
    if (boxPlaneMesh.geometry) boxPlaneMesh.geometry.dispose();
  }
  const bedMap = trayBedMaterial ? trayBedMaterial.map : null;
  if (trayBedMaterial) {
    if (trayBedMaterial.map) trayBedMaterial.map.dispose();
    if (trayBedMaterial.bumpMap && trayBedMaterial.bumpMap !== trayBedMaterial.map) {
      trayBedMaterial.bumpMap.dispose();
    }
    trayBedMaterial.dispose();
  }
  if (trayWallMaterial) {
    if (trayWallMaterial.map && trayWallMaterial.map !== bedMap) {
      trayWallMaterial.map.dispose();
    }
    if (trayWallMaterial.bumpMap && trayWallMaterial.bumpMap !== trayWallMaterial.map && trayWallMaterial.bumpMap !== bedMap) {
      trayWallMaterial.bumpMap.dispose();
    }
    trayWallMaterial.dispose();
  }
  if (scene.environment) {
    scene.environment.dispose();
    scene.environment = null;
  }
  renderer.dispose();
}

async function waitForRequiredAssets(needBoxImage = false) {
  if (trimPromise && !trimAssetSettled) {
    await trimPromise;
    if (isWebGLDisposed) return false;
  }
  if (needBoxImage && boxPromise && !boxAssetSettled) {
    await boxPromise;
    if (isWebGLDisposed) return false;
  }
  return !isWebGLDisposed;
}

window.addEventListener('message', async (e) => {
  if (!e.data) return;
  if (e.data.type === 'DISPOSE_OCHKO') {
    disposeAllWebGLResources();
    return;
  }
  if (isWebGLDisposed) return;

  if (e.data.type === 'PAUSE_OCHKO') {
    clearAllGameTimers();
    isRenderPaused = true;
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    return;
  }
  if (e.data.type === 'RESUME_OCHKO') {
    isRenderPaused = false;
    requestRender();
    return;
  }
  if (e.data.type === 'OCHKO_OPEN') {
    const mySeq = ++messageSeq;
    clearAllGameTimers();
    activeThrowAnim = null;
    flyingTrophyAnims.length = 0;
    game.rolling = false;
    hideSuspendedPromptBanner();
    isRenderPaused = false;

    applyBackgroundValue(e.data.bg || resolveParentSceneBackground());

    const isBoxReq = (e.data.mode === 'box');
    if (!trimAssetSettled || (isBoxReq && !boxAssetSettled)) {
      const ok = await waitForRequiredAssets(isBoxReq);
      if (!ok || mySeq !== messageSeq || isWebGLDisposed) return;
    }

    if (isBoxReq) {
      applyExternalConfig({
        bg: e.data.bg,
        ownedCounts: e.data.ownedCounts,
        playerOwnedCounts: e.data.playerOwnedCounts,
        playerInventory: e.data.playerInventory,
        playerSkins: e.data.playerSkins,
        mode: 'box'
      });
      renderer.render(scene, camera);
      revealWebglWrap();
    } else if (e.data.mode === 'match') {
      game.playerWins = 0;
      game.botWins = 0;
      applyExternalConfig({
        bg: e.data.bg,
        opponent: e.data.opponent,
        game: e.data.game,
        ownedCounts: e.data.ownedCounts,
        playerOwnedCounts: e.data.playerOwnedCounts,
        playerInventory: e.data.playerInventory,
        playerSkins: e.data.playerSkins,
        mode: 'match'
      });
      startNewRoundWithTiebreak();
      renderer.render(scene, camera);
      revealWebglWrap();
    }
    return;
  }
  if (e.data.type === 'OPEN_BOX_ONLY') {
    const mySeq = ++messageSeq;
    clearAllGameTimers();
    activeThrowAnim = null;
    flyingTrophyAnims.length = 0;
    game.rolling = false;
    hideSuspendedPromptBanner();
    isRenderPaused = false;

    applyBackgroundValue(e.data.bg || resolveParentSceneBackground());

    if (!trimAssetSettled || !boxAssetSettled) {
      const ok = await waitForRequiredAssets(true);
      if (!ok || mySeq !== messageSeq || isWebGLDisposed) return;
    }
    applyExternalConfig({ ...e.data, mode: 'box' });
    renderer.render(scene, camera);
    revealWebglWrap();
  } else if (e.data.type === 'INIT_OCHKO' || e.data.bg || e.data.opponent || e.data.mode) {
    const mySeq = ++messageSeq;
    isRenderPaused = false;
    applyBackgroundValue(e.data.bg || resolveParentSceneBackground());

    const isBoxReq = (e.data.mode === 'box' || e.data.boxOnly === true || e.data.boxOnly === '1');
    if (!trimAssetSettled || (isBoxReq && !boxAssetSettled)) {
      const ok = await waitForRequiredAssets(isBoxReq);
      if (!ok || mySeq !== messageSeq || isWebGLDisposed) return;
    }
    applyExternalConfig(e.data);
    const shouldRestart = Boolean(
      e.data.restart ||
      e.data.type === 'INIT_OCHKO' ||
      game.phase === 'trophy_pick' ||
      game.phase === 'match_lost' ||
      game.phase === 'over'
    );
    if (shouldRestart && !isStandaloneBoxMode) startNewRoundWithTiebreak();
    renderer.render(scene, camera);
    revealWebglWrap();
  }
});

function autoDetectIndexEnvironment(options = {}) {
  try {
    const params = INITIAL_URL_PARAMS;
    const urlCfg = {};
    if (params.get('bg')) urlCfg.bg = params.get('bg');
    if (params.get('opponent')) urlCfg.opponent = params.get('opponent');
    if (params.get('game')) urlCfg.game = params.get('game');
    if (INITIAL_IS_BOX_MODE) urlCfg.mode = 'box';
    else if (params.get('mode') === 'match') urlCfg.mode = 'match';

    const savedOwned = localStorage.getItem('ochko_owned_counts') || localStorage.getItem('ochko_player_inventory');
    if (savedOwned) {
      const parsedInv = JSON.parse(savedOwned);
      if (Array.isArray(parsedInv) && parsedInv.length === 8) urlCfg.playerOwnedCounts = parsedInv;
    }

    const savedSkins = localStorage.getItem('ochko_player_skins');
    if (savedSkins) {
      const parsed = JSON.parse(savedSkins);
      if (Array.isArray(parsed) && parsed.length === 6) urlCfg.playerSkins = parsed;
    }

    if (!urlCfg.bg) {
      const parentBg = resolveParentSceneBackground();
      if (parentBg) {
        urlCfg.bg = parentBg;
      } else {
        const lsBg = localStorage.getItem('current_location_bg') || localStorage.getItem('location_bg');
        if (lsBg) urlCfg.bg = lsBg;
      }
    }

    if (Object.keys(urlCfg).length > 0) {
      applyExternalConfig(urlCfg, options);
    }
  } catch (e) {}
}

function isCrossOriginUrl(path) {
  if (!/^https?:\/\//i.test(path)) return false;
  try {
    return new URL(path).origin !== window.location.origin;
  } catch (e) {
    return false;
  }
}

function loadImageWithFallbacks(paths, timeoutMs = ASSET_LOAD_TIMEOUT_MS, batchSize = 4) {
  if (!CAN_AUTOLOAD_RELATIVE || !paths || !paths.length) return Promise.resolve(null);
  return new Promise((resolve) => {
    let settled = false;
    const finish = (img) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(img);
    };
    const timer = setTimeout(() => finish(null), timeoutMs);

    let nextIdx = 0;
    const runBatch = () => {
      if (settled) return;
      if (nextIdx >= paths.length) {
        finish(null);
        return;
      }
      const batch = paths.slice(nextIdx, nextIdx + batchSize);
      nextIdx += batch.length;
      let remainingInBatch = batch.length;

      batch.forEach((rawPath) => {
        if (settled) return;
        const img = new Image();
        if (isCrossOriginUrl(rawPath)) {
          img.crossOrigin = 'anonymous';
        }
        img.onload = () => {
          if (settled) return;
          if (img.naturalWidth > 0) {
            finish(img);
          } else {
            remainingInBatch--;
            if (remainingInBatch === 0 && !settled) runBatch();
          }
        };
        img.onerror = () => {
          if (settled) return;
          remainingInBatch--;
          if (remainingInBatch === 0 && !settled) runBatch();
        };
        img.src = encodeURI(rawPath);
      });
    };

    runBatch();
  });
}

function applyLoadedTrimImage(img, refreshScene = true) {
  if (isWebGLDisposed || !img) return;
  try {
    trimCtx.clearRect(0, 0, TRIM_SIZE, TRIM_SIZE);
    trimCtx.drawImage(img, 0, 0, TRIM_SIZE, TRIM_SIZE);
  } catch (e) {
    return;
  }
  disposeMaterialCache();

  if (!refreshScene) return;
  boardDice.forEach(d => { d.mesh.material = getDiceMaterial(d.skinId); });
  if (collectorBoxBuilt) {
    boxInstancedMeshes.forEach((im, idx) => {
      im.material = getCountInBoxCell(idx) > 0 ? getDiceMaterial(idx) : emptyBoxMat;
    });
    if (isBoxOpen) rebuildTopHand3DDice();
  }
  if (!isStandaloneBoxMode) {
    rebuildLedgeDice();
  } else {
    redrawCornerDiceButtons();
  }
  requestRender();
}

function applyLoadedBoxImage(img) {
  if (isWebGLDisposed || !img) return;
  pendingBoxImage = img;
  if (!collectorBoxBuilt || !boxPlaneMesh) return;

  try {
    const cutCanvas = createBoxCanvasWithFrameMask(img);
    const prevMap = boxPlaneMesh.material.map;
    const tex = new THREE.CanvasTexture(cutCanvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    boxPlaneMesh.material.map = tex;
    boxPlaneMesh.material.needsUpdate = true;
    if (prevMap) prevMap.dispose();
    requestRender();
  } catch (e) {}
}

const gltfLoader = new GLTFLoader();
function applyCustomGlb(root) {
  if (isWebGLDisposed || !root) return;
  let foundMesh = null;
  root.traverse(n => { if (n.isMesh && !foundMesh) foundMesh = n; });
  if (!foundMesh) return;

  const rawGeo = foundMesh.geometry.clone();
  rawGeo.computeBoundingBox();
  const center = new THREE.Vector3(), size = new THREE.Vector3();
  rawGeo.boundingBox.getCenter(center); rawGeo.boundingBox.getSize(size);
  rawGeo.translate(-center.x, -center.y, -center.z);
  const scale = BASE_DICE_SIZE / (Math.max(size.x, size.y, size.z) || 1);
  rawGeo.scale(scale, scale, scale);

  const prevGeo = masterDiceGeo;
  masterDiceGeo = projectTCrossUVs(rawGeo);
  rawGeo.dispose();
  if (prevGeo) prevGeo.dispose();

  boardDice.forEach(d => { d.mesh.geometry = masterDiceGeo; });
  if (collectorBoxBuilt) {
    boxInstancedMeshes.forEach(im => { im.geometry = masterDiceGeo; });
    if (isBoxOpen) rebuildTopHand3DDice();
  }
  if (!isStandaloneBoxMode) {
    rebuildLedgeDice();
  }
  requestRender();
}

function loadGlbWithTimeout(paths, timeoutMs = ASSET_LOAD_TIMEOUT_MS) {
  const pathList = Array.isArray(paths) ? paths : [paths];
  if (!CAN_AUTOLOAD_RELATIVE || !pathList.length) return Promise.resolve(null);
  return new Promise((resolve) => {
    let settled = false;
    const finish = (gltf) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(gltf);
    };
    const timer = setTimeout(() => finish(null), timeoutMs);

    let idx = 0;
    const tryNext = () => {
      if (settled) return;
      if (idx >= pathList.length) {
        finish(null);
        return;
      }
      try {
        gltfLoader.load(
          encodeURI(pathList[idx]),
          (gltf) => finish(gltf),
          undefined,
          () => { idx++; tryNext(); }
        );
      } catch (e) {
        idx++;
        tryNext();
      }
    };
    tryNext();
  });
}

/* ============================================================================
   13. СТАРТ БЕЗ МЕЛЬКАНИЯ И ЭКОНОМНЫЙ РЕНДЕР ПО ТРЕБОВАНИЮ
============================================================================ */
async function bootstrapScene() {
  if (!INITIAL_URL_PARAMS.get('bg') && window.parent && window.parent !== window) {
    const immediateParentBg = resolveParentSceneBackground();
    if (immediateParentBg) applyBackgroundValue(immediateParentBg);
  }

  resetBotSkinsForRound();
  autoDetectIndexEnvironment({ deferBoxOpen: INITIAL_IS_BOX_MODE, deferVisuals: true });

  trimPromise = loadImageWithFallbacks(
    [
      './ТРИМ ЛИСТ.jpg', './ТРИМ ЛИСТ.JPG', './Трим лист.jpg', './Трим Лист.jpg', './трим лист.jpg',
      './ТРИМ ЛИСТ.png', './Трим лист.png', './трим лист.png',
      './ТРИМ ЛИСТ.jpeg', './ТРИМ ЛИСТ.webp',
      './события/ТРИМ ЛИСТ.jpg', './события/трим лист.jpg'
    ],
    ASSET_LOAD_TIMEOUT_MS
  ).then(img => {
    trimAssetSettled = true;
    if (img && !isWebGLDisposed) {
      const alreadyRendered = wrapEl.classList.contains('ready') || boardDice.length > 0 || playerLedgeMeshes.length > 0 || collectorBoxBuilt;
      appliedTrimOnBoot = true;
      applyLoadedTrimImage(img, alreadyRendered);
    }
    return img;
  });

  boxPromise = loadImageWithFallbacks(
    [
      './КУБИКИ.jpg', './КУБИКИ.JPG', './Кубики.jpg', './кубики.jpg',
      './КУБИКИ.png', './Кубики.png', './кубики.png',
      './КУБИКИ.jpeg', './КУБИКИ.webp',
      './события/КУБИКИ.jpg', './события/кубики.jpg'
    ],
    ASSET_LOAD_TIMEOUT_MS
  ).then(img => {
    boxAssetSettled = true;
    if (img && !isWebGLDisposed) {
      pendingBoxImage = img;
      if (collectorBoxBuilt) applyLoadedBoxImage(img);
    }
    return img;
  });

  loadImageWithFallbacks(
    [
      './Баннеры.png', './баннеры.png', './БАННЕРЫ.png', './Баннеры.PNG',
      './Баннеры.webp', './баннеры.webp', './события/Баннеры.png'
    ],
    ASSET_LOAD_TIMEOUT_MS
  ).then(img => { if (img && !isWebGLDisposed) applyBannerImage(img); });

  loadImageWithFallbacks(
    [
      './доска.jpg', './Доска.jpg', './ДОСКА.jpg',
      './дерево.jpg', './Дерево.jpg', './ДЕРЕВО.jpg',
      './события/доска.jpg'
    ],
    ASSET_LOAD_TIMEOUT_MS
  ).then(img => { if (img && !isWebGLDisposed) applyBoardWoodTexture(img); });

  loadGlbWithTimeout(
    ['./dice.glb', './Dice.glb', './DICE.glb', './события/dice.glb'],
    ASSET_LOAD_TIMEOUT_MS
  ).then(gltf => { if (gltf && gltf.scene && !isWebGLDisposed) applyCustomGlb(gltf.scene); });

  if (INITIAL_IS_BOX_MODE) {
    const ok = await waitForRequiredAssets(true);
    if (!ok) return;

    if (messageSeq === 0 && isStandaloneBoxMode) {
      document.getElementById('close-box-sub').textContent = '(вернуться в инвентарь)';
      setCollectorBoxOpen(true);
      renderer.render(scene, camera);
      revealWebglWrap();
    }
  } else {
    const ok = await waitForRequiredAssets(false);
    if (!ok) return;

    if (messageSeq === 0 && !isStandaloneBoxMode && !isBoxOpen) {
      document.body.classList.remove('mode-box-boot');
      resetBotSkinsForRound();
      rebuildLedgeDice();
      updateHUD();
      renderer.render(scene, camera);
      revealWebglWrap();

      if (!hasStartedMatch) {
        autoTiebreakTimerId = scheduleGameTimeout(() => {
          if (!isStandaloneBoxMode && !isBoxOpen && !isWebGLDisposed && game.phase === 'tiebreak' && !game.rolling) {
            runInitialTiebreakRoll(2);
          }
        }, 400);
      }
    }
  }
}

bootstrapScene();

window.addEventListener('resize', () => {
  if (isWebGLDisposed) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  requestRender();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  } else if (!isRenderPaused && !isWebGLDisposed) {
    requestRender();
  }
});

window.addEventListener('beforeunload', disposeAllWebGLResources);

function animate(now) {
  rafId = null;
  if (isRenderPaused || isWebGLDisposed) return;

  let keepAnimating = false;

  if (flyingTrophyAnims.length > 0) {
    keepAnimating = true;
    for (let i = flyingTrophyAnims.length - 1; i >= 0; i--) {
      const fa = flyingTrophyAnims[i];
      if (now < fa.startTime) continue;
      const t = Math.min(1, (now - fa.startTime) / fa.duration);
      const ease = 1 - Math.pow(1 - t, 3);
      fa.mesh.position.lerpVectors(fa.startPos, fa.endPos, ease);
      fa.mesh.position.y += Math.sin(t * Math.PI) * 2.1;
      fa.mesh.rotation.x = t * Math.PI * 2;
      fa.mesh.rotation.z = t * Math.PI;
      fa.mesh.scale.setScalar(BOARD_SCALE * (0.85 + Math.sin(t * Math.PI) * 0.25));

      if (t >= 1) {
        sfx.init(); sfx.playHit(0.65, false);
        const cb = fa.onDone;
        flyingTrophyAnims.splice(i, 1);
        if (cb) cb();
      }
    }
  }

  if (isBoxOpen && collectorBoxBuilt) {
    let needsInstUpdate = false;
    const minSepBox = getBoxDiceSize() * 1.12;

    for (let t = 0; t < 8; t++) {
      const visibleCount = getCountInBoxCell(t);
      if (visibleCount <= 0) continue;
      const states = boxDiceStates[t];
      const b = getCellBounds(t);

      for (let k = 0; k < visibleCount; k++) {
        const st = states[k];
        if (
          Math.abs(st.vx) > 5e-4 || Math.abs(st.vz) > 5e-4 ||
          Math.abs(st.offsetY) > 5e-4 || Math.abs(st.velY) > 5e-4 ||
          Math.abs(st.wobbleX) > 1e-3 || Math.abs(st.velWX) > 1e-3 ||
          Math.abs(st.wobbleZ) > 1e-3 || Math.abs(st.velWZ) > 1e-3
        ) {
          needsInstUpdate = true;
          st.x += st.vx;
          st.z += st.vz;
          st.vx *= 0.86;
          st.vz *= 0.86;
          if (Math.abs(st.vx) < 5e-4) st.vx = 0;
          if (Math.abs(st.vz) < 5e-4) st.vz = 0;

          if (st.x < b.minX) { st.x = b.minX; st.vx = Math.abs(st.vx) * 0.6; }
          if (st.x > b.maxX) { st.x = b.maxX; st.vx = -Math.abs(st.vx) * 0.6; }
          if (st.z < b.minZ) { st.z = b.minZ; st.vz = Math.abs(st.vz) * 0.6; }
          if (st.z > b.maxZ) { st.z = b.maxZ; st.vz = -Math.abs(st.vz) * 0.6; }

          st.offsetY += st.velY;
          if (st.offsetY > BOX_CEILING_Y) {
            st.offsetY = BOX_CEILING_Y;
            st.velY = -Math.abs(st.velY) * 0.45;
          }
          if (st.offsetY > 0) {
            st.velY -= 0.0095;
          } else {
            st.offsetY = 0;
            st.velY = -st.velY * 0.28;
            if (Math.abs(st.velY) < 0.004) st.velY = 0;
          }

          st.wobbleX += st.velWX;
          st.wobbleZ += st.velWZ;
          st.velWX = (st.velWX - st.wobbleX * 0.18) * 0.82;
          st.velWZ = (st.velWZ - st.wobbleZ * 0.18) * 0.82;
          if (Math.abs(st.wobbleX) < 1e-3 && Math.abs(st.velWX) < 1e-3) { st.wobbleX = 0; st.velWX = 0; }
          if (Math.abs(st.wobbleZ) < 1e-3 && Math.abs(st.velWZ) < 1e-3) { st.wobbleZ = 0; st.velWZ = 0; }
        }
      }

      for (let i = 0; i < visibleCount; i++) {
        for (let j = i + 1; j < visibleCount; j++) {
          const A = states[i], B = states[j];
          let dx = B.x - A.x, dz = B.z - A.z;
          let dist = Math.hypot(dx, dz);
          if (minSepBox - dist > 0.001) {
            needsInstUpdate = true;
            if (dist < 0.0001) { dx = 0.01; dz = 0.01; dist = Math.hypot(dx, dz); }
            const nx = dx / dist, nz = dz / dist;
            const overlap = (minSepBox - dist) * 0.52;
            A.x = Math.max(b.minX, Math.min(b.maxX, A.x - nx * overlap));
            A.z = Math.max(b.minZ, Math.min(b.maxZ, A.z - nz * overlap));
            B.x = Math.max(b.minX, Math.min(b.maxX, B.x + nx * overlap));
            B.z = Math.max(b.minZ, Math.min(b.maxZ, B.z + nz * overlap));
          }
        }
      }
    }

    if (needsInstUpdate) {
      keepAnimating = true;
      updateBox3DDiceTransforms(true);
    }

    topHandMeshes.forEach(h => {
      if (h.hopY > 0 || Math.abs(h.velY) > 5e-4) {
        keepAnimating = true;
        h.hopY += h.velY;
        if (h.hopY > 0.36) { h.hopY = 0.36; h.velY = -Math.abs(h.velY) * 0.4; }
        if (h.hopY > 0) h.velY -= 0.009;
        else { h.hopY = 0; h.velY = 0; }
        h.mesh.position.y = h.baseY + h.hopY;
      }
    });
  }

  if (activeThrowAnim) {
    keepAnimating = true;
    const elapsed = now - activeThrowAnim.start;
    const progress = Math.min(1, elapsed / activeThrowAnim.duration);
    const stepIdx = Math.min(activeThrowAnim.steps, Math.floor(progress * activeThrowAnim.steps));

    activeThrowAnim.newBodies.forEach((b, i) => {
      const f = b.frames[stepIdx];
      if (f) { b.mesh.position.copy(f.pos); b.mesh.quaternion.copy(f.quat); }
      b.sounds.forEach((ev, evIdx) => {
        const key = `${i}_${evIdx}`;
        if (stepIdx >= ev.step && !activeThrowAnim.played.has(key)) {
          activeThrowAnim.played.add(key);
          sfx.playHit(ev.force, ev.bone);
        }
      });
    });

    activeThrowAnim.restingBodies.forEach(r => {
      const f = r.frames[stepIdx];
      if (f) r.mesh.position.copy(f.pos);
    });

    if (progress >= 1) {
      const cb = activeThrowAnim.onComplete;
      activeThrowAnim = null;
      if (cb) cb();
    }
  }

  if (keepAnimating) {
    candlePoint.intensity = 25 + Math.sin(now * 0.007) * 1.8 + Math.cos(now * 0.019) * 1.1;
  } else {
    candlePoint.intensity = 25;
  }

  renderer.render(scene, camera);

  if (keepAnimating || activeThrowAnim !== null || flyingTrophyAnims.length > 0) {
    requestRender();
  }
}
</script>
