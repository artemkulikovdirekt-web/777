    /* СЮЖЕТНЫЕ КАРТОЧКИ ВСЕГДА ИДУТ В НАЧАЛЕ ЛЕВОЙ КОЛОДЫ ПЕРЕД БЫТОВЫМИ ДЕЙСТВИЯМИ */
    function getLeftActionDeck() {
      const ids = [];

      // Если мы стоим перед открытой дверью квартиры в подъезде — показываем только действия у двери
      if (state.logicalRoom === "landing" && state.activeDoorApt) {
        state.storyCardIds.forEach((id) => {
          if (["play_dice_door", "take_granny_cans", "give_granny_water", "leave_door_view"].includes(id)) {
            ids.push(id);
          }
        });
        return ids.map((id) => CARDS_DB[id] ? { id, ...CARDS_DB[id] } : null).filter(Boolean);
      }

      // 1. Сначала ставим сюжетные карточки (storyCardIds), чтобы они никогда не уезжали за стрелку прокрутки!
      state.storyCardIds.forEach((id) => {
        if (!ids.includes(id)) ids.push(id);
      });

      if (state.hasBrochure1 && !state.readBrochure1 && !ids.includes("read_brochure_1")) {
        ids.unshift("read_brochure_1");
      }

      // Пока не выполнены стартовые действия (халат, вода, туалет, батарея, свеча), гарантируем наличие поиска в хламе
      if (!state.roomNavUnlocked) {
        if (state.basicNavUnlocked && state.junkSearches === 0 && !ids.includes("room_search_junk")) {
          ids.push("room_search_junk");
        }
        return ids.map((id) => CARDS_DB[id] ? { id, ...CARDS_DB[id] } : null).filter(Boolean);
      }

      // 2. Бытовые действия текущей комнаты добавляем после сюжетных карточек
      const r = state.logicalRoom;
      if (r === "landing") {
        if (state.landingFloor === 3) ["landing_back_home", "knock_23", "knock_24"].forEach(k => { if (!ids.includes(k)) ids.push(k); });
        else if (state.landingFloor === 2) ["knock_19", "knock_20", "knock_21"].forEach(k => { if (!ids.includes(k)) ids.push(k); });
        else if (state.landingFloor === 1) ["knock_16", "knock_17", "knock_18"].forEach(k => { if (!ids.includes(k)) ids.push(k); });
      } else if (r === "kitchen") {
        ["room_supplies", "room_look_window", "room_radio"].forEach(k => { if (!ids.includes(k)) ids.push(k); });
      } else if (r === "bedroom") {
        ["room_thermometer", "room_bed"].forEach(k => { if (!ids.includes(k)) ids.push(k); });
      } else if (r === "junkroom") {
        if (!ids.includes("room_search_junk")) ids.push("room_search_junk");
        if (state.wentOutside && !ids.includes("room_dumbbells")) ids.push("room_dumbbells");
      } else if (r === "entrance") {
        ["room_peephole", "room_exit_door"].forEach(k => { if (!ids.includes(k)) ids.push(k); });
      }

      return ids.map((id) => CARDS_DB[id] ? { id, ...CARDS_DB[id] } : null).filter(Boolean);
    }

    /* ============================================================================
       13. РЕНДЕР ДВУХ КАРУСЕЛЕЙ КАРТОЧЕК
    ============================================================================ */
    const leftCardsEl = document.getElementById("left-action-cards");
    const rightCardsEl = document.getElementById("right-move-cards");
    const rightGroupEl = document.getElementById("right-move-group");
    const actPrevBtn = document.getElementById("act-prev"), actNextBtn = document.getElementById("act-next");
    const movPrevBtn = document.getElementById("mov-prev"), movNextBtn = document.getElementById("mov-next");
    let cardActivatingLock = false;

    function renderDeckSlice(container, items, offset, animateDeal = false) {
      container.innerHTML = "";
      items.slice(offset, offset + 3).forEach((card, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-card" + (animateDeal ? " deal-anim" : "");
        if (animateDeal) btn.style.setProperty("--deal-delay", `${idx * 75}ms`);
        btn.disabled = state.isWalking;

        const inner = document.createElement("div");
        inner.className = "card-inner";
        const iconDiv = document.createElement("div");
        iconDiv.className = "card-icon-frame";
        applyIconSprite(iconDiv, card.sheet, card.icon);
        const cap = document.createElement("div");
        cap.className = "choice-caption";
        cap.textContent = card.caption;
        inner.appendChild(iconDiv);
        inner.appendChild(cap);

        const back = document.createElement("div");
        back.className = "card-back";

        btn.appendChild(inner);
        btn.appendChild(back);

        btn.onclick = () => {
          if (state.isWalking || cardActivatingLock) return;
          cardActivatingLock = true;
          playCardSound("flip");
          if (typeof card.instantSound === "function") card.instantSound();
          btn.classList.remove("deal-anim");
          btn.classList.add("activating");
          setTimeout(() => {
            cardActivatingLock = false;
            card.action();
          }, 360);
        };
        container.appendChild(btn);
      });
    }

    function renderUI(animateDeal = false) {
      if (animateDeal && !state.isWalking) playCardSound("deal");
      const leftDeck = getLeftActionDeck();
      const maxLeftOffset = Math.max(0, leftDeck.length - 3);
      if (state.actOffset > maxLeftOffset) state.actOffset = maxLeftOffset;
      renderDeckSlice(leftCardsEl, leftDeck, state.actOffset, animateDeal);
      actPrevBtn.disabled = state.isWalking || state.actOffset <= 0;
      actNextBtn.disabled = state.isWalking || state.actOffset + 3 >= leftDeck.length;

      const rightDeck = getRightMoveDeck();
      rightGroupEl.style.visibility = rightDeck.length > 0 ? "visible" : "hidden";
      const maxRightOffset = Math.max(0, rightDeck.length - 3);
      if (state.movOffset > maxRightOffset) state.movOffset = maxRightOffset;
      renderDeckSlice(rightCardsEl, rightDeck, state.movOffset, animateDeal);
      movPrevBtn.disabled = state.isWalking || state.movOffset <= 0;
      movNextBtn.disabled = state.isWalking || state.movOffset + 3 >= rightDeck.length;
    }

    actPrevBtn.onclick = () => { if (state.actOffset > 0) { state.actOffset--; playCardSound("click"); renderUI(false); } };
    actNextBtn.onclick = () => { const d = getLeftActionDeck(); if (state.actOffset + 3 < d.length) { state.actOffset++; playCardSound("click"); renderUI(false); } };
    movPrevBtn.onclick = () => { if (state.movOffset > 0) { state.movOffset--; playCardSound("click"); renderUI(false); } };
    movNextBtn.onclick = () => { const d = getRightMoveDeck(); if (state.movOffset + 3 < d.length) { state.movOffset++; playCardSound("click"); renderUI(false); } };

    /* ============================================================================
       14. СПИЧКА И СВЕЧА: ТАСКАНИЕ ПО ВСЕМУ ЭКРАНУ + КРУГ СВЕТА ВОКРУГ ПЛАМЕНИ + АВТОВОЗВРАТ
    ============================================================================ */
    const stageEl = document.getElementById("stage-16x9");
    const flameCanvas = document.getElementById("center-flame-canvas");
    const fCtx = flameCanvas.getContext("2d");

    let isDraggingTorch = false;
    let dragStartX = 0, dragStartY = 0;
    let torchOffsetX = 0, torchOffsetY = 0;
    let smoothTorchX = 0, smoothTorchY = 0;
    let lastFlameCanvasY = 65;

    flameCanvas.addEventListener("pointerdown", (e) => {
      if (state.lightMode !== "match" && state.lightMode !== "candle" && state.lightMode !== "kerosene") return;
      isDraggingTorch = true;
      flameCanvas.classList.add("dragging");
      dragStartX = e.clientX - torchOffsetX;
      dragStartY = e.clientY - torchOffsetY;
      if (flameCanvas.setPointerCapture) flameCanvas.setPointerCapture(e.pointerId);
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDraggingTorch) return;
      const stRect = stageEl.getBoundingClientRect();
      const maxX = stRect.width * 0.48;
      const maxYUp = stRect.height * 0.88;
      const maxYDown = stRect.height * 0.08;
      const rawX = e.clientX - dragStartX;
      const rawY = e.clientY - dragStartY;
      torchOffsetX = Math.max(-maxX, Math.min(maxX, rawX));
      torchOffsetY = Math.max(-maxYUp, Math.min(maxYDown, rawY));
    });

    function stopTorchDrag() {
      if (!isDraggingTorch) return;
      isDraggingTorch = false;
      flameCanvas.classList.remove("dragging");
      torchOffsetX = 0;
      torchOffsetY = 0;
    }
    window.addEventListener("pointerup", stopTorchDrag);
    window.addEventListener("pointercancel", stopTorchDrag);

    function drawRealisticFlame(ctx, x, y, scale, t) {
      const sway = Math.sin(t * 13) * 2.2 + Math.cos(t * 21) * 1.1;
      const h = (24 + Math.sin(t * 18) * 2.8) * scale;

      const glow = ctx.createRadialGradient(x, y - 9 * scale, 2, x, y - 9 * scale, 40 * scale);
      glow.addColorStop(0, "rgba(255, 195, 85, 0.55)");
      glow.addColorStop(0.5, "rgba(255, 110, 20, 0.2)");
      glow.addColorStop(1, "rgba(255, 70, 0, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y - 9 * scale, 40 * scale, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#ff8514";
      ctx.beginPath();
      ctx.moveTo(x - 6 * scale, y);
      ctx.quadraticCurveTo(x - 8.5 * scale, y - h * 0.5, x + sway, y - h);
      ctx.quadraticCurveTo(x + 8.5 * scale, y - h * 0.5, x + 6 * scale, y);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#fff5b8";
      ctx.beginPath();
      ctx.moveTo(x - 3 * scale, y);
      ctx.quadraticCurveTo(x - 4.2 * scale, y - h * 0.35, x + sway * 0.6, y - h * 0.7);
      ctx.quadraticCurveTo(x + 4.2 * scale, y - h * 0.35, x + 3 * scale, y);
      ctx.closePath(); ctx.fill();
    }

    function renderCenterMatchAndCandle(now) {
      const t = now * 0.001;
      fCtx.clearRect(0, 0, flameCanvas.width, flameCanvas.height);
      const cx = flameCanvas.width / 2;

      if (state.lightMode === "match") {
        const p = Math.min(1, (now - state.matchStart) / MATCH_DURATION);
        if (p >= 1) {
          state.lightMode = "none";
          stopTorchDrag();
          document.body.setAttribute("data-lit", "false");
          addStoryCard(state.hasCandle ? "light_candle" : "light_match", true);
          renderUI(true);
          return;
        }
        const botY = 174, fullLen = 110, topY = botY - fullLen;
        const burnY = topY + p * (fullLen - 20);
        lastFlameCanvasY = burnY - 12;

        const woodGrad = fCtx.createLinearGradient(cx - 3.5, burnY, cx + 3.5, burnY);
        woodGrad.addColorStop(0, "#b8864c"); woodGrad.addColorStop(0.5, "#e0b478"); woodGrad.addColorStop(1, "#9c6d36");
        fCtx.fillStyle = woodGrad;
        fCtx.fillRect(cx - 3.5, burnY, 7, botY - burnY);

        const charTopY = topY + p * 34;
        fCtx.strokeStyle = "#171412";
        fCtx.lineWidth = 5; fCtx.lineCap = "round";
        fCtx.beginPath();
        fCtx.moveTo(cx, burnY);
        fCtx.quadraticCurveTo(cx + 5 * p, (burnY + charTopY) * 0.5, cx + 8 * p, charTopY);
        fCtx.stroke();

        fCtx.fillStyle = "#29221e";
        fCtx.beginPath(); fCtx.arc(cx + 8 * p, charTopY, 3.8, 0, Math.PI * 2); fCtx.fill();

        fCtx.fillStyle = "#f94125";
        fCtx.fillRect(cx - 3.5, burnY - 3, 7, 4);

        drawRealisticFlame(fCtx, cx, burnY - 2, 0.95, t);
      } else if (state.lightMode === "candle" || state.lightMode === "kerosene") {
        const elapsedCandle = Math.max(0, now - state.candleStart);
        const p = state.lightMode === "candle" ? Math.min(1, elapsedCandle / CANDLE_DURATION) : 0.15;
        if (p >= 1) {
          state.lightMode = "none";
          stopTorchDrag();
          document.body.setAttribute("data-lit", "false");
          addStoryCard("light_candle", true);
          renderUI(true);
          return;
        }
        const botY = 174, maxH = 102, minH = 24;
        const curH = maxH - p * (maxH - minH);
        const topY = botY - curH;
        lastFlameCanvasY = topY - 16;

        const waxGrad = fCtx.createLinearGradient(cx - 14, topY, cx + 14, topY);
        waxGrad.addColorStop(0, "#cbbba0"); waxGrad.addColorStop(0.45, "#f7f2e6"); waxGrad.addColorStop(1, "#a8987e");
        fCtx.fillStyle = waxGrad;
        fCtx.fillRect(cx - 14, topY, 28, curH);

        fCtx.fillStyle = "#eee7d8";
        fCtx.beginPath();
        fCtx.arc(cx - 9, topY + 12 + p * 10, 2.8, 0, Math.PI * 2);
        fCtx.arc(cx + 8, topY + 19 + p * 8, 2.5, 0, Math.PI * 2);
        fCtx.fill();

        fCtx.strokeStyle = "#1c1917"; fCtx.lineWidth = 2;
        fCtx.beginPath(); fCtx.moveTo(cx, topY); fCtx.lineTo(cx, topY - 7); fCtx.stroke();

        // Пламя самой свечи загорается только когда поднесённая спичка коснулась фитиля (now >= state.candleWickLitTime)
        if (state.lightMode === "kerosene" || now >= state.candleWickLitTime) {
          const wickGrow = state.lightMode === "kerosene" ? 1 : Math.min(1, (now - state.candleWickLitTime) / 380);
          drawRealisticFlame(fCtx, cx, topY - 6, 1.12 * wickGrow, t);
        }

        if (now < state.candleIgniteEnd) {
          const totalIgnite = state.candleIgniteEnd - state.candleIgniteStart || 2200;
          const prog = Math.min(1, (now - state.candleIgniteStart) / totalIgnite);
          // Спичка приближается к фитилю (0..0.35), зажигает его и отводится (0.35..1.0)
          const approach = prog < 0.35 ? (prog / 0.35) : (1 - (prog - 0.35) / 0.65);
          const mx = cx + 34 - approach * 28;
          const my = topY - 6;
          fCtx.save();
          fCtx.translate(mx, my); fCtx.rotate(-0.42);
          fCtx.fillStyle = "#d6a76c"; fCtx.fillRect(0, -2.2, 38, 4.5);
          fCtx.fillStyle = "#1c1917"; fCtx.fillRect(-6, -2.6, 7, 5.2);
          fCtx.restore();
          drawRealisticFlame(fCtx, mx - 4, my, 0.78, t);
        }
      }
    }

    /* ============================================================================
       15. ГЛАВНЫЙ ЦИКЛ: ШАР СВЕТА ЧЁТКО ПРИВЯЗАН К КОНЧИКУ СПИЧКИ/СВЕЧИ
    ============================================================================ */
    let currentLightRadius = 0;

    function animateLoop(ts) {
      const t = ts * 0.001;
      const lerpSpeed = isDraggingTorch ? 0.28 : 0.14;
      smoothTorchX += (torchOffsetX - smoothTorchX) * lerpSpeed;
      smoothTorchY += (torchOffsetY - smoothTorchY) * lerpSpeed;

      const tiltDeg = Math.max(-14, Math.min(14, smoothTorchX * 0.035));
      flameCanvas.style.transform = `translate3d(${smoothTorchX.toFixed(1)}px, ${smoothTorchY.toFixed(1)}px, 0) rotate(${tiltDeg.toFixed(2)}deg)`;

      renderCenterMatchAndCandle(ts);

      const stRect = stageEl.getBoundingClientRect();
      const cvRect = flameCanvas.getBoundingClientRect();
      const flameRatioY = Math.max(0.1, Math.min(0.9, lastFlameCanvasY / flameCanvas.height));
      const flameScreenX = cvRect.left + cvRect.width * 0.5;
      const flameScreenY = cvRect.top + cvRect.height * flameRatioY;

      const lx = ((flameScreenX - stRect.left) / (stRect.width || 1)) * 100 + Math.sin(t * 3.1) * 0.25;
      const ly = ((flameScreenY - stRect.top) / (stRect.height || 1)) * 100 + Math.cos(t * 2.6) * 0.25;

      const normX = (lx - 50) / 50;
      const normY = (ly - 50) / 50;

      const isStatic = (state.currentScene === "cabinet" || FULL_BRIGHT_SCENES.has(state.currentScene)) && !state.isWalking;
      const px = isStatic ? 0 : -normX * 10;
      const py = isStatic ? 0 : -normY * 7;
      const bobX = isStatic ? 0 : (walkBobIntensity ? Math.sin(t * 7.5) * 8 : Math.sin(t * 1.4) * 1.5);
      const bobY = isStatic ? 0 : (walkBobIntensity ? Math.abs(Math.cos(t * 7.5)) * 10 : Math.cos(t * 1.8) * 2);
      const fl = Math.sin(t * 6.3) * 0.4 + Math.sin(t * 14.7) * 0.35 + Math.cos(t * 23.1) * 0.25;
      const sw = stRect.width || window.innerWidth;

      let tr = 0;
      if (state.lightMode === "match") tr = sw * 0.26 + fl * (sw * 0.015);
      else if (state.lightMode === "candle") {
        const wickLit = ts >= state.candleWickLitTime;
        tr = (wickLit ? sw * 0.44 : sw * 0.26) + fl * (sw * 0.018);
      }
      else if (state.lightMode === "kerosene") tr = sw * 0.58 + fl * (sw * 0.012);
      currentLightRadius += (tr - currentLightRadius) * 0.1;

      const isLit = state.lightMode === "match" || state.lightMode === "candle" || state.lightMode === "kerosene";
      const alpha = isLit ? Math.min(1, 0.94 + fl * 0.04) : 0;

      const root = document.documentElement.style;
      root.setProperty("--parallax-x", `${px.toFixed(1)}px`);
      root.setProperty("--parallax-y", `${py.toFixed(1)}px`);
      root.setProperty("--bob-x", `${bobX.toFixed(1)}px`);
      root.setProperty("--bob-y", `${bobY.toFixed(1)}px`);
      root.setProperty("--light-x", `${lx.toFixed(2)}%`);
      root.setProperty("--light-y", `${ly.toFixed(2)}%`);
      root.setProperty("--light-r", `${Math.max(0, currentLightRadius).toFixed(1)}px`);
      root.setProperty("--light-alpha", alpha.toFixed(3));

      requestAnimationFrame(animateLoop);
    }

    applyBackgroundToSlot(slotA, "bedroom");
    updateBackpackBadge();
    renderUI(true);
    preloadNpcSprites();
    requestAnimationFrame(animateLoop);
  </script>
</body>
</html>
