<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depression Monitor - Beck Scale</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types (необходимы для Recharts в браузере) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    
    <!-- Заглушка для Recharts -->
    <script>
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
    
    <!-- Подключаем Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (версия 2.x через CDN часто требует специфического порядка) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Функция для безопасного получения компонентов Recharts
        const getRechartsComponent = (name) => {
            if (window.Recharts && window.Recharts[name]) {
                return window.Recharts[name];
            }
            // Заглушка, если библиотека еще не загрузилась (хотя Babel ждет выполнения скриптов)
            return () => null;
        };

        const LineChart = getRechartsComponent('LineChart');
        const Line = getRechartsComponent('Line');
        const XAxis = getRechartsComponent('XAxis');
        const YAxis = getRechartsComponent('YAxis');
        const CartesianGrid = getRechartsComponent('CartesianGrid');
        const Tooltip = getRechartsComponent('Tooltip');
        const ResponsiveContainer = getRechartsComponent('ResponsiveContainer');

        const BECK_QUESTIONS = [
            { id: 1, title: "Настроение", options: ["Я не чувствую себя несчастным.", "Я чувствую себя несчастным.", "Я все время несчастен и не могу от этого освободиться.", "Я настолько несчастен и печален, что больше не могу этого выносить."] },
            { id: 2, title: "Пессимизм", options: ["Я не настроен пессимистично в отношении своего будущего.", "Я чувствую, что больше чем обычно расстроен своим будущим.", "Я чувствую, что мне нечего ждать от будущего.", "Я чувствую, что мое будущее безнадежно и станет только хуже."] },
            { id: 3, title: "Чувство несостоятельности", options: ["Я не чувствую себя неудачником.", "Я чувствую, что терпел неудачи чаще, чем другие.", "Когда я оглядываюсь на свою жизнь, я вижу в ней много неудач.", "Я чувствую себя полным неудачником как личность."] },
            { id: 4, title: "Неудовлетворенность", options: ["Я получаю столько же удовольствия от жизни, как и раньше.", "Я не получаю столько же удовольствия, как раньше.", "Я получаю очень мало удовлетворения от тех вещей, которые раньше мне нравились.", "Я ни от чего не получаю удовлетворения."] },
            { id: 5, title: "Чувство вины", options: ["Я не чувствую себя в чем-либо особенно виноватым.", "Довольно часто я чувствую себя виноватым.", "Большую часть времени я чувствую себя виноватым.", "Я постоянно чувствую себя виноватым."] },
            { id: 6, title: "Ощущение наказания", options: ["Я не чувствую, что меня за что-то наказывают.", "Я чувствую, что могу быть наказан.", "Я ожидаю, что буду наказан.", "Я чувствую, что уже наказан."] },
            { id: 7, title: "Самообвинение", options: ["Я не разочарован в себе.", "Я разочарован в себе.", "Я себе противен.", "Я себя ненавижу."] },
            { id: 8, title: "Критичность к себе", options: ["Я не критикую и не виню себя больше, чем обычно.", "Я более критичен к себе, чем раньше.", "Я критикую себя за все свои ошибки.", "Я виню себя во всем плохом, что происходит."] },
            { id: 9, title: "Суицидальные мысли", options: ["У меня нет никаких мыслей о самоповреждении.", "У меня бывают мысли о самоповреждении, но я не стал бы их осуществлять.", "Я хотел бы покончить с собой.", "Я бы покончил с собой, если бы представился случай."] },
            { id: 10, title: "Слезливость", options: ["Я плачу не больше, чем обычно.", "Я плачу чаще, чем раньше.", "Я плачу по любому поводу.", "Мне хочется плакать, но я не могу."] },
            { id: 11, title: "Раздражительность", options: ["Я не более раздражителен, чем обычно.", "Я более раздражителен, чем обычно.", "Я постоянно чувствую раздражение.", "Меня вообще больше ничего не раздражает, потому что мне все равно."] },
            { id: 12, title: "Утрата интереса", options: ["Я не утратил интереса к другим людям.", "Я меньше интересуюсь другими людьми, чем раньше.", "Я почти утратил интерес к другим людям.", "Я полностью утратил интерес к другим людям."] },
            { id: 13, title: "Нерешительность", options: ["Я принимаю решения так же легко, как и раньше.", "Я чаще откладываю принятие решений, чем раньше.", "Мне труднее принимать решения, чем раньше.", "Я больше не могу принимать никаких решений."] },
            { id: 14, title: "Бесполезность", options: ["Я не чувствую, что я выгляжу хуже, чем обычно.", "Я обеспокоен тем, что выгляжу старым или непривлекательным.", "Я чувствую, что в моей внешности произошли изменения, которые делают меня непривлекательным.", "Я уверен, что выгляжу ужасно."] },
            { id: 15, title: "Утрата трудоспособности", options: ["Я могу работать так же хорошо, как и раньше.", "Мне требуется дополнительное усилие, чтобы начать что-то делать.", "Я должен заставлять себя с большим трудом, чтобы хоть что-то сделать.", "Я совсем не могу работать."] },
            { id: 16, title: "Расстройство сна", options: ["Мой сон не изменился.", "Я сплю немного хуже, чем раньше.", "Я просыпаюсь на 1-2 часа раньше и мне трудно заснуть снова.", "Я просыпаюсь на несколько часов раньше и вообще не могу заснуть."] },
            { id: 17, title: "Утомляемость", options: ["Я устаю не больше, чем обычно.", "Я устаю быстрее, чем обычно.", "Я устаю почти от всего, что я делаю.", "Я слишком устал, чтобы что-либо делать."] },
            { id: 18, title: "Аппетит", options: ["Мой аппетит не изменился.", "Мой аппетит немного хуже, чем раньше.", "Мой аппетит гораздо хуже, чем раньше.", "У меня совсем нет аппетита."] },
            { id: 19, title: "Снижение веса", options: ["Я не терял в весе за последнее время.", "Я потерял более 2 кг.", "Я потерял более 4 кг.", "Я потерял более 7 кг."] },
            { id: 20, title: "Ипохондрия", options: ["Я беспокоюсь о своем здоровье не больше, чем обычно.", "Я обеспокоен своими болями, расстройством желудка или запорами.", "Я очень обеспокоен своим здоровьем, и мне трудно думать о чем-то другом.", "Я настолько обеспокоен своим здоровьем, что не могу ни о чем другом думать."] },
            { id: 21, title: "Потеря либидо", options: ["Мой интерес к сексу не изменился.", "Я меньше интересуюсь сексом, чем раньше.", "Сейчас я значительно меньше интересуюсь сексом.", "Я полностью утратил интерес к сексу."] }
        ];

        function App() {
            const [view, setView] = useState('dashboard');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState(new Array(21).fill(null));
            const [history, setHistory] = useState([]);

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('beck_history_v3');
                    if (saved) setHistory(JSON.parse(saved));
                } catch (e) {
                    console.error("Failed to load history", e);
                }
            }, []);

            const saveToHistory = (score) => {
                const newEntry = {
                    date: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
                    score: score,
                    timestamp: Date.now()
                };
                const updatedHistory = [...history, newEntry].slice(-8);
                setHistory(updatedHistory);
                localStorage.setItem('beck_history_v3', JSON.stringify(updatedHistory));
            };

            const handleAnswer = (value) => {
                const newAnswers = [...answers];
                newAnswers[currentQuestion] = value;
                setAnswers(newAnswers);

                if (currentQuestion < 20) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    const total = newAnswers.reduce((a, b) => a + (b || 0), 0);
                    saveToHistory(total);
                    setView('dashboard');
                }
            };

            const getInterpretation = (score) => {
                if (score === null || score === undefined) return { label: 'Нет данных', color: 'text-slate-400', desc: 'Пройдите первый тест.' };
                if (score <= 13) return { label: 'Норма', color: 'text-emerald-400', desc: 'Симптомов нет.' };
                if (score <= 19) return { label: 'Легкая', color: 'text-yellow-400', desc: 'Мягкая форма.' };
                if (score <= 29) return { label: 'Умеренная', color: 'text-orange-400', desc: 'Выраженная депрессия.' };
                return { label: 'Тяжелая', color: 'text-red-500', desc: 'Нужна помощь врача.' };
            };

            const latestScore = history.length > 0 ? history[history.length - 1].score : null;
            const interpretation = getInterpretation(latestScore);

            return (
                <div className="min-h-screen text-slate-200 p-4 md:p-8">
                    <div className="max-w-4xl mx-auto">
                        <header className="flex justify-between items-center mb-10">
                            <div>
                                <h1 className="text-3xl font-black text-white italic tracking-tighter">DEPRESSION MONITOR</h1>
                                <p className="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Beck Scale Tracking System</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setView('dashboard')} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${view === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>DASHBOARD</button>
                                <button onClick={() => {setView('test'); setCurrentQuestion(0); setAnswers(new Array(21).fill(null));}} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${view === 'test' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>NEW TEST</button>
                            </div>
                        </header>

                        {view === 'dashboard' ? (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="bg-[#1e293b] p-8 rounded-[2rem] border border-slate-800 shadow-2xl">
                                    <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Текущий результат</span>
                                    <div className="text-5xl font-black text-white my-2 tracking-tight">{latestScore !== null ? latestScore : '--'}</div>
                                    <div className={`text-xl font-bold mb-4 ${interpretation.color}`}>{interpretation.label}</div>
                                    <p className="text-slate-400 text-sm italic leading-relaxed mb-6">{interpretation.desc}</p>
                                    <div className="p-4 bg-indigo-500/10 rounded-2xl border border-indigo-500/20 text-xs text-indigo-300">
                                        Данные сохраняются локально в вашем браузере.
                                    </div>
                                </div>

                                <div className="lg:col-span-2 bg-[#1e293b] p-8 rounded-[2rem] border border-slate-800 shadow-2xl flex flex-col min-h-[400px]">
                                    <h3 className="text-white font-bold mb-8 flex items-center gap-2 uppercase text-xs tracking-widest text-slate-400">Динамика за 8 недель</h3>
                                    <div className="flex-grow w-full">
                                        {history.length > 0 ? (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={history}>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                                    <XAxis dataKey="date" stroke="#64748b" fontSize={10} axisLine={false} tickLine={false} />
                                                    <YAxis domain={[0, 63]} stroke="#64748b" fontSize={10} axisLine={false} tickLine={false} />
                                                    <Tooltip 
                                                        contentStyle={{backgroundColor: '#0f172a', border: '1px solid #334155', borderRadius: '12px'}}
                                                        itemStyle={{color: '#818cf8'}}
                                                    />
                                                    <Line 
                                                        type="monotone" 
                                                        dataKey="score" 
                                                        stroke="#6366f1" 
                                                        strokeWidth={4} 
                                                        dot={{r:6, fill:'#6366f1', strokeWidth: 0}} 
                                                        activeDot={{r:8}}
                                                    />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        ) : (
                                            <div className="h-full flex items-center justify-center text-slate-600 italic text-sm border-2 border-dashed border-slate-800 rounded-3xl">
                                                Нет данных. Пройдите первый тест.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-xl mx-auto bg-[#1e293b] rounded-[2.5rem] border border-slate-800 overflow-hidden shadow-2xl animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="h-1.5 bg-slate-800 w-full">
                                    <div className="h-full bg-indigo-500 transition-all duration-300" style={{width: `${((currentQuestion + 1)/21)*100}%`}}></div>
                                </div>
                                <div className="p-10">
                                    <div className="text-indigo-400 text-[10px] font-black uppercase tracking-widest mb-4">Вопрос {currentQuestion + 1} / 21</div>
                                    <h2 className="text-2xl font-bold text-white mb-8 leading-tight">{BECK_QUESTIONS[currentQuestion].title}</h2>
                                    <div className="space-y-3">
                                        {BECK_QUESTIONS[currentQuestion].options.map((opt, i) => (
                                            <button 
                                                key={i} 
                                                onClick={() => handleAnswer(i)} 
                                                className="w-full text-left p-5 rounded-2xl bg-slate-900/50 border border-slate-800 hover:border-indigo-500 hover:bg-slate-800/50 transition-all text-slate-300 hover:text-white text-sm"
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
